name: Interactive Windows stability

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  desktop:
    # Only the default branch can run code on the team’s interactive desktop.
    if: github.ref == 'refs/heads/main'
    runs-on: [self-hosted, Windows, X64, tinypdf-desktop]
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build and validate on a dedicated Windows desktop
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE) { throw 'Release build failed' }
          $fixture = "./target/desktop-${{ github.run_id }}-${{ github.run_attempt }}.pdf"
          ./scripts/new-benchmark-pdf.ps1 -Output $fixture -Pages 501
          $exe = './target/release/tinypdf.exe'
          foreach ($round in 1..3) {
            python ./scripts/stress-windows.py $exe $fixture --recovery-only
            if ($LASTEXITCODE) { throw "Recovery pass $round failed" }
          }
          python ./scripts/stress-windows.py $exe $fixture --cycles 150 --burst 20 --theme dark --screenshot ./target/desktop-result.png
      - name: Upload verified desktop capture
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-desktop
          path: target/desktop-result.png
          if-no-files-found: error
