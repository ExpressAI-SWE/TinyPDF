name: Windows checks

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 20 * * 0'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Audit locked Rust dependencies
        run: |
          rustup toolchain install 1.98.0 --profile minimal
          cargo +1.98.0 install --locked --version 0.22.2 cargo-audit
          cargo audit

  windows:
    runs-on: windows-2025
    timeout-minutes: 55
    env:
      CARGO_TERM_COLOR: always
      NO_PROXY: localhost,127.0.0.1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Rust and check formatting
        shell: pwsh
        run: |
          rustup toolchain install 1.98.0 --profile minimal --component rustfmt
          if ($LASTEXITCODE) { throw 'Rust installation failed' }
          rustup override set 1.98.0
          if ($LASTEXITCODE) { throw 'Could not select Rust 1.98.0' }
          cargo fmt --check
      - name: Debug tests
        run: cargo test --locked --all-targets
      - name: Optimized rendering and recovery tests
        if: github.event_name != 'pull_request'
        run: cargo test --locked --release
      - name: Build and exercise the portable reader
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          cargo build --release --locked
          if ($LASTEXITCODE) { throw 'Release build failed' }
          New-Item -ItemType Directory -Path target/installer-test -Force | Out-Null
          ./scripts/new-benchmark-pdf.ps1 -Output ./target/short.pdf -Pages 3
          ./scripts/new-benchmark-pdf.ps1 -Output ./target/long.pdf -Pages 4000
          ./scripts/bench-pdfium.ps1 -Executable ./target/release/tinypdf.exe -Pdf ./target/short.pdf -Runs 20 |
            Set-Content target/installer-test/short.json
          ./scripts/bench-pdfium.ps1 -Executable ./target/release/tinypdf.exe -Pdf ./target/long.pdf -Runs 10 |
            Set-Content target/installer-test/long.json
      - name: Build candidate packages with verified tools
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: ./scripts/build-windows-candidate.ps1 -Binary ./target/release/tinypdf.exe -OutputDirectory ./dist/candidate
      - name: Install and remove the three candidates independently
        if: github.event_name != 'pull_request'
        shell: pwsh
        run: |
          $sdk = Get-Content target/windows-packaging/sdk.txt
          foreach ($installer in 'NSIS', 'MSI', 'MSIX') {
            ./scripts/test-windows-installers.ps1 -PackageDirectory ./dist/candidate -Pdf ./target/short.pdf -Installer $installer -SignTool (Join-Path $sdk 'signtool.exe')
          }
      - name: Upload diagnostics
        if: always() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-checks
          path: target/installer-test
          if-no-files-found: ignore
      - name: Upload validated candidate artifacts
        if: success() && github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: tinypdf-windows-x64-candidate
          path: dist/candidate/
          if-no-files-found: error
